name: Umbrella contracts and bootstrap
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.9'
      - run: python -m pip install -r services/api/requirements.lock -r requirements-dev.txt
      - run: python scripts/export-api-contract.py --check
      - run: python scripts/verify.py
      - run: python -m unittest discover -s tests -v
      - run: ruff check scripts/init-local-env.py tests/test_local_configuration.py --select E4,E7,E9,F,S
      - run: mypy scripts/init-local-env.py tests/test_local_configuration.py --strict --follow-imports=skip
      - run: bandit scripts/init-local-env.py -ll
      - run: ruff check scripts/doctor.py --select E4,E7,E9,F,S --ignore S603,S310
      - run: mypy scripts/doctor.py --strict --follow-imports=skip
      - run: ruff check scripts/export-api-contract.py tests/test_contract_snapshot.py scripts/snapshot-runtime.py tests/test_snapshot_runtime.py --select E4,E7,E9,F,S --ignore S603,S310
      - run: mypy scripts/export-api-contract.py tests/test_contract_snapshot.py scripts/snapshot-runtime.py tests/test_snapshot_runtime.py --strict --follow-imports=skip
      - run: bandit scripts/export-api-contract.py scripts/snapshot-runtime.py -ll
      - run: bash -n scripts/bootstrap-wsl.sh scripts/doctor.sh infra/postgres-init.sh
      - run: python scripts/init-local-env.py
      - run: docker compose --env-file .env --env-file infra/images.lock.env -f infra/compose.yaml config --quiet
      - name: Verify offline bootstrap preserves commit pins
        run: |
          python scripts/export-bundles.py .bootstrap/ci-export
          python scripts/bootstrap-local.py .bootstrap/ci-export "$RUNNER_TEMP/adf-restored"
          python "$RUNNER_TEMP/adf-restored/scripts/verify.py"
