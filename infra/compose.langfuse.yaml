# Overlay the checksum-verified OFFICIAL source; never start this file alone.
# docker compose --project-name adf-langfuse --env-file .bootstrap/langfuse/.env \
#   -f infra/vendor/langfuse/docker-compose.yml -f infra/compose.langfuse.yaml \
#   --profile observability config --no-interpolate
# Production grouping is adapted into project adf by scripts/compose-adf.py.
x-local-runtime: &local-runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  langfuse-web:
    <<: *local-runtime
    profiles: [observability]
    image: ${LANGFUSE_WEB_IMAGE:?run prepare-langfuse.py}
    mem_limit: 2g
    cpus: 2
    ports: !override ["127.0.0.1:3000:3000"]
    networks:
      default:
      telemetry:
        aliases: [adf-langfuse]
    environment:
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:39090
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:39090
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
  langfuse-worker:
    <<: *local-runtime
    profiles: [observability]
    image: ${LANGFUSE_WORKER_IMAGE:?run prepare-langfuse.py}
    mem_limit: 2g
    cpus: 2
    ports: !override []
    environment:
      HOSTNAME: "0.0.0.0"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
  clickhouse:
    <<: *local-runtime
    profiles: [observability]
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:?run prepare-langfuse.py}
    mem_limit: 3g
    cpus: 2
    ports: !override []
  minio:
    <<: *local-runtime
    profiles: [observability]
    image: ${LANGFUSE_MINIO_IMAGE:?run prepare-langfuse.py}
    mem_limit: 512m
    cpus: 1
    ports: !override ["127.0.0.1:39090:9000"]
  postgres:
    <<: *local-runtime
    profiles: [observability]
    image: ${LANGFUSE_POSTGRES_IMAGE:?run prepare-langfuse.py}
    mem_limit: 1g
    cpus: 1
    ports: !override []
  redis:
    <<: *local-runtime
    profiles: [observability]
    image: ${LANGFUSE_REDIS_IMAGE:?run prepare-langfuse.py}
    mem_limit: 256m
    cpus: 1
    ports: !override []
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?run prepare-langfuse.py}
    command: !override ["/bin/sh", "-ec", 'exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction --requirepass "$$REDIS_AUTH"']
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_AUTH" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  telemetry:
    external: true
    name: adf-telemetry
